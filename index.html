<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Lovella Luxury</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --gold: #d4af37;
        --dark: #0a0a0a;
        --light-gold: #f4e4bc;
        --white: #ffffff;
      }
      body {
        font-family: "Georgia", serif;
        background: var(--dark);
        margin: 0;
        padding: 15px;
        color: var(--white);
        -webkit-tap-highlight-color: transparent;
      }
      .hidden {
        display: none;
      }

      .brand-header {
        text-align: center;
        padding: 40px 0;
        letter-spacing: 8px;
        text-transform: uppercase;
      }
      .brand-header h1 {
        font-size: 35px;
        margin: 0;
        color: var(--gold);
        font-weight: 300;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .card {
        background: #111;
        padding: 30px 10px;
        border: 0.5px solid rgba(212, 175, 55, 0.3);
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Buyurtma berish tugmasi uchun maxsus keng uslub */
      .order-wide {
        grid-column: span 2;
        border: 1px solid var(--gold);
        background: linear-gradient(145deg, #1a1a1a, #000);
        margin-top: 10px;
      }

      .card i {
        font-size: 24px;
        color: var(--gold);
        margin-bottom: 15px;
      }
      .card b {
        color: var(--white);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 400;
      }

      .product-card {
        background: #111;
        margin-bottom: 25px;
        border: 1px solid #222;
      }
      .product-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
      }
      .p-info {
        padding: 20px;
        text-align: center;
      }
      .p-name {
        font-size: 18px;
        color: var(--white);
        margin-bottom: 8px;
      }
      .price {
        color: var(--gold);
        font-size: 1.1em;
        margin-bottom: 20px;
      }

      .btn-call {
        display: block;
        background: var(--gold);
        color: var(--dark);
        text-decoration: none;
        padding: 14px;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 2px;
      }

      .btn-back {
        background: transparent;
        color: var(--gold);
        border: none;
        padding: 15px;
        margin-bottom: 20px;
        width: 100%;
        border-bottom: 1px solid #222;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="brand-header">
      <h1>LOVELLA</h1>
      <p style="color: var(--gold); font-size: 9px; margin-top: 10px">
        The Art of Luxury Living
      </p>
    </div>

    <div id="main-menu">
      <div class="grid" id="category-list">
        <!-- Kategoriyalar va tugma shu yerga tushadi -->
      </div>
    </div>

    <div id="product-page" class="hidden">
      <button class="btn-back" onclick="showMain()">
        ← back to collection
      </button>
      <h2
        id="cat-title"
        style="
          text-align: center;
          color: var(--gold);
          font-weight: 300;
          letter-spacing: 4px;
          text-transform: uppercase;
          font-size: 16px;
          margin-bottom: 30px;
        "
      ></h2>
      <div id="products-list"></div>
    </div>

    <script>
      const tg = window.Telegram ? window.Telegram.WebApp : null;
      if (tg) {
        tg.expand();
        tg.ready();
      }

      const ADMIN_PHONE = "+998 99-420-20-20";

      // MAHSULOTLAR RO'YXATI
      const products = [
        {
          cat: "Ko'rpa",
          name: "Royal Silk Duvet",
          price: "1,200,000",
          img: "img10.jpg",
        },
        {
          cat: "Yostiq",
          name: "Imperial Pillow",
          price: "400,000",
          img: "img11.jpg",
        },
      ];

      // 7 TA KATEGORIYA (G'iloflar qaytarildi)
      const categories = {
        "Ko'rpa": "fa-solid fa-bed",
        Yostiq: "fa-solid fa-cloud",
        Choyshab: "fa-solid fa-rug",
        Pastel: "fa-solid fa-palette",
        "Banny xalat": "fa-solid fa-shirt",
        Sochiqlar: "fa-solid fa-scroll",
        "G'iloflar": "fa-solid fa-box-archive",
      };

      const catList = document.getElementById("category-list");

      // Kategoriyalarni chiqarish
      Object.keys(categories).forEach((cat) => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<i class="${categories[cat]}"></i><b>${cat}</b>`;
        div.onclick = () => showProducts(cat);
        catList.appendChild(div);
      });

      // ALOHIDA BUYURTMA BERISH TUGMASI (OXIRIDA)
      const orderDiv = document.createElement("div");
      orderDiv.className = "card order-wide";
      orderDiv.innerHTML = `
            <a href="tel:${ADMIN_PHONE}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
                <i class="fa-solid fa-phone-volume"></i>
                <b>Buyurtma berish</b>
            </a>`;
      catList.appendChild(orderDiv);

      function showProducts(catName) {
        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("product-page").classList.remove("hidden");
        document.querySelector(".brand-header").classList.add("hidden");
        document.getElementById("cat-title").innerText = catName;

        const list = document.getElementById("products-list");
        list.innerHTML = "";

        const filtered = products.filter((p) => p.cat === catName);
        if (filtered.length === 0) {
          list.innerHTML =
            '<p style="text-align:center; color: #444; margin-top: 50px; letter-spacing: 2px;">COLLECTION COMING SOON</p>';
        }

        filtered.forEach((p) => {
          list.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}">
                        <div class="p-info">
                            <div class="p-name">${p.name}</div>
                            <div class="price">${p.price} UZS</div>
                            <a href="tel:${ADMIN_PHONE}" class="btn-call">Inquiry & Order</a>
                        </div>
                    </div>
                `;
        });
        if (tg) tg.BackButton.show();
      }

      function showMain() {
        document.getElementById("main-menu").classList.remove("hidden");
        document.getElementById("product-page").classList.add("hidden");
        document.querySelector(".brand-header").classList.remove("hidden");
        if (tg) tg.BackButton.hide();
      }

      if (tg) tg.BackButton.onClick(showMain);
    </script>
  </body>
</html>
